[project]
name = "trunks"
description = "Git repos backed by your own storage. Push to S3, R2, Tigris, MinIO, Postgres, SFTP, NFS, or local disk."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
authors = [{ name = "Brain", email = "brain@layerbrain.com" }]
keywords = ["git", "storage", "s3", "r2", "tigris", "filesystem", "version-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Archiving :: Backup",
]
# Fast-by-default. orjson works on every supported platform; uvloop has no
# Windows port (asyncio.ProactorEventLoop is the floor there), so it ships
# only on POSIX via PEP 508 marker. There is no runtime "try uvloop / fall
# back" branch — installation alone determines availability.
dependencies = [
    "orjson>=3.10",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://layerbrain.com/trunks"
Source = "https://github.com/layerbrain/trunks"
Issues = "https://github.com/layerbrain/trunks/issues"

[project.optional-dependencies]
s3 = ["httpx"]
azure = ["azure-storage-blob"]
gcs = ["google-cloud-storage"]
sftp = ["asyncssh"]
postgres = ["asyncpg"]
testing = ["testcontainers"]

[project.scripts]
trunks = "trunks.cli:main"

[build-system]
requires = ["hatchling>=1.18,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trunks"]

[tool.hatch.version]
path = "trunks/version.py"

[tool.hatch.build.targets.sdist]
include = ["trunks", "README.md", "docs/**/*.md", "docs/media/*.svg", "trunks-node/**/*.ts", "trunks-node/*.json", "trunks-node/*.md", "trunks-python/*.toml", "trunks-python/*.md"]
