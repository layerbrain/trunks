[project]
name = "trunks-python"
version = "1.2.2"
description = "Git repos backed by your own storage. Push to S3, R2, Tigris, MinIO, Postgres, SFTP, NFS, or local disk."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Brain", email = "brain@layerbrain.com" }]
dependencies = ["trunks==1.2.2"]

[build-system]
requires = ["hatchling>=1.18,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["README.md"]

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml"]
